services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [dokploy-network]
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    network_mode: "service:minio"
    cap_add: [net_admin, net_raw]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_OBJECTSTORAGE}
      TS_HOSTNAME: portal-object-storage
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:core
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/local/bin/containerboot &
        boot_pid=$!
        while kill -0 "$$boot_pid" 2>/dev/null; do
          tailscale --socket=/tmp/tailscaled.sock serve --service=svc:objectstorage --tcp=9000 tcp://localhost:9000 >/dev/null 2>&1
          sleep 10
        done
        exit 1
    volumes:
      - ts-objectstorage-state:/var/lib/tailscale
    restart: unless-stopped
    depends_on: [minio]

volumes:
  minio-data:
    external: true
    name: ${MINIO_VOLUME_NAME}
  ts-objectstorage-state:

networks:
  dokploy-network:
    external: true
