services:
  worker-api:
    build:
      context: .
      dockerfile: packages/portal/Dockerfile
    command: ["python", "-m", "portal.worker.api"]
    env_file: [.env]
    environment:
      # The host binding below controls exposure.
      PORTAL_WORKER_API_HOST: "0.0.0.0"
    volumes:
      - ${PORTAL_MASTER_KEY_HOST_PATH}:/run/secrets/portal-master-key:ro
    ports:
      # Publish on the tailnet address.
      - "${PORTAL_WORKER_API_BIND_IP}:8443:8443"
    networks: [dokploy-network]
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
