services:
  worker-api:
    build:
      context: .
      dockerfile: packages/portal/Dockerfile
    command: ["python", "-m", "portal.worker.api"]
    env_file: [.env]
    environment:
      PORTAL_MASTER_KEY_FILE: /run/secrets/portal-master-key
    volumes:
      - ${PORTAL_MASTER_KEY_HOST_PATH}:/run/secrets/portal-master-key:ro
    networks: [dokploy-network]
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    network_mode: "service:worker-api"
    cap_add: [net_admin, net_raw]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_WORKER_API}
      TS_HOSTNAME: portal-worker-api
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:core
      TS_SERVE_CONFIG: /config/serve.json
      # See docker-compose.postgres.yml: required in practice for containerboot
      # to actually advertise the svc: entry from TS_SERVE_CONFIG on startup.
      TS_EXPERIMENTAL_SERVICE_AUTO_ADVERTISEMENT: "true"
    volumes:
      - ts-worker-api-state:/var/lib/tailscale
      - ./ops/tailscale/worker-api:/config:ro
    restart: unless-stopped
    depends_on: [worker-api]

volumes:
  ts-worker-api-state:

networks:
  dokploy-network:
    external: true
