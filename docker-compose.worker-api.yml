services:
  worker-api:
    build:
      context: .
      dockerfile: packages/portal/Dockerfile
    command: ["python", "-m", "portal.worker.api"]
    env_file: [.env]
    environment:
      PORTAL_MASTER_KEY_FILE: /run/secrets/portal-master-key
    volumes:
      - ${PORTAL_MASTER_KEY_HOST_PATH}:/run/secrets/portal-master-key:ro
    networks: [dokploy-network]
    restart: unless-stopped

  # See docker-compose.postgres.yml for why this runs `tailscale serve`
  # directly instead of relying on TS_SERVE_CONFIG.
  tailscale:
    image: tailscale/tailscale:latest
    network_mode: "service:worker-api"
    cap_add: [net_admin, net_raw]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_WORKER_API}
      TS_HOSTNAME: portal-worker-api
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:core
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/local/bin/containerboot &
        while true; do
          tailscale --socket=/tmp/tailscaled.sock serve --service=svc:worker-api --tcp=8443 tcp://localhost:8443 >/dev/null 2>&1
          sleep 10
        done
    volumes:
      - ts-worker-api-state:/var/lib/tailscale
    restart: unless-stopped
    depends_on: [worker-api]

volumes:
  ts-worker-api-state:

networks:
  dokploy-network:
    external: true
