[tools]
uv = "0.12.3"
python = "3.14.7"
postgres = "18.4"
node = "26.7.0"

[tasks.install]
run = "uv sync --all-packages --all-groups"

[tasks.update]
run = "uv sync -U"

[tasks.outdated]
run = "uv pip list --outdated"

[tasks.format]
run = [
  "uv run ruff format",
  "uv run ruff check --fix",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --reformat --quiet",
]

[tasks."portal:assets"]
description = "Refresh vendored browser assets"
run = ["npm ci --no-audit --no-fund", "npm run vendor"]

[tasks."portal:docker:build"]
run = "docker build --file packages/portal/Dockerfile --tag osiptel-portal ."

[tasks."db:init"]
description = "Create the local postgres cluster if missing"
run = """
data_dir="$PWD/.data/postgres"

if [ ! -f "$data_dir/PG_VERSION" ]; then
  mkdir -p "$data_dir"
  mise x postgres -- initdb -D "$data_dir" -U postgres \\
    --auth-host=trust --auth-local=trust --no-instructions
fi
"""

[tasks.dev]
description = "Run postgres, bootstrap, and the app"
depends = ["db:init"]
run = """
data_dir="$PWD/.data/postgres"

# The local cluster is disposable, so durability is disabled for faster writes.
mise x postgres -- postgres -D "$data_dir" -h 127.0.0.1 -p 5432 \\
  -c fsync=off -c synchronous_commit=off -c full_page_writes=off &
pg_pid=$!

trap 'mise x postgres -- pg_ctl -D "$data_dir" stop -m fast -w 2>/dev/null || kill "$pg_pid" 2>/dev/null' EXIT

until mise x postgres -- pg_isready -h 127.0.0.1 -p 5432 -U postgres -q; do
  sleep 0.1
done

uv run --env-file .env portal-bootstrap
uv run --env-file .env osiptel-portal
"""

[tasks.reset]
description = "Delete the local postgres cluster"
run = """
mise x postgres -- pg_ctl -D "$PWD/.data/postgres" stop -m fast -w 2>/dev/null || true
rm -rf "$PWD/.data/postgres"
"""

[tasks."db:start"]
description = "Start the local postgres cluster"
depends = ["db:init"]
run = """
if ! mise x postgres -- pg_isready -h 127.0.0.1 -p 5432 -U postgres -q; then
  mise x postgres -- pg_ctl -D "$PWD/.data/postgres" \\
    -l "$PWD/.data/postgres/server.log" \\
    -o "-h 127.0.0.1 -p 5432 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \\
    -w start
fi
"""

[tasks."portal:schema"]
description = "Snapshot the portal schema"
depends = ["db:start"]
run = """
uv run --env-file .env portal-migrate

mise x postgres -- pg_dump -h 127.0.0.1 -p 5432 -U postgres -d postgres \\
  --schema-only --no-owner --no-privileges \\
  --exclude-table=portal_schema_migrations \\
  | grep -v -e '^\\\\restrict ' -e '^\\\\unrestrict ' \\
            -e '^-- Dumped from database version' \\
            -e '^-- Dumped by pg_dump version' \\
  > packages/portal/schema.sql
"""

[tasks.check]
run = [
  "uv run mypy .",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --check",
]

[tasks.test]
depends = ["db:start"]
run = "uv run pytest"

[tasks.build]
run = [
  "rm -rf packages/fetch/dist packages/fetch/build",
  "uv run pyinstaller --distpath packages/fetch/dist --workpath packages/fetch/build packages/fetch/fetch.spec",
]
