[tools]
uv = "0.13.1"
python = "3.15.0"
postgres = "18.6"
minio = "2025.10.15.17.29.55"
node = "26.12.0"
terraform = "1.16.6"
aws-cli = "2.38.2"
shellcheck = "0.11.0"

# Every local server port comes from the checkout path, so worktrees do not
# share a database or object store and the ports survive restarts with no state
# file. The four ranges are disjoint and below the kernel's ephemeral range.
[vars]
port_slot = "{{ exec(command='printf %s ' ~ config_root | quote ~ ' | cksum | cut -d\" \" -f1') }}"

[env]
PORTAL_DEV_WEB_PORT = "{{ 23000 + vars.port_slot | int % 1000 }}"
PORTAL_DEV_POSTGRES_PORT = "{{ 24000 + vars.port_slot | int % 1000 }}"
PORTAL_DEV_MINIO_PORT = "{{ 25000 + vars.port_slot | int % 1000 }}"
PORTAL_DEV_MINIO_CONSOLE_PORT = "{{ 26000 + vars.port_slot | int % 1000 }}"
PORTAL_DATABASE_DSN = "postgresql://postgres@127.0.0.1:{{ env.PORTAL_DEV_POSTGRES_PORT }}/postgres"
PORTAL_WORKER_DATABASE_ADDRESS = "127.0.0.1:{{ env.PORTAL_DEV_POSTGRES_PORT }}"
PORTAL_OBJECT_STORAGE_ENDPOINT = "http://127.0.0.1:{{ env.PORTAL_DEV_MINIO_PORT }}"
PORTAL_PUBLIC_ORIGIN = "http://localhost:{{ env.PORTAL_DEV_WEB_PORT }}"

[tasks.install]
run = "uv sync --locked --all-groups"

[tasks."install:core"]
run = "uv sync --locked --all-groups --reinstall-package core"

[tasks.update]
run = [
  "uv lock -U",
  "uv lock --project packages/cli -U",
  "uv lock --project packages/portal -U",
]

[tasks.outdated]
run = "uv pip list --outdated"

[tasks.format]
run = [
  "uv run ruff format",
  "uv run ruff check --fix",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --reformat --quiet",
]

[tasks."portal:assets"]
description = "Refresh vendored browser assets"
run = ["npm ci --no-audit --no-fund", "npm run vendor"]

[tasks."portal:docker:build"]
description = "Build the portal image and tag it as PORTAL_IMAGE (default portal:local)"
run = 'docker build --file packages/portal/Dockerfile --tag "${PORTAL_IMAGE:-portal:local}" .'

[tasks."portal:key"]
description = "Write the local master key file if it is missing"
run = """
key_file="$PWD/.data/master.key"

if [ ! -f "$key_file" ]; then
  mkdir -p "$PWD/.data"
  uv run portal-admin key install --path "$key_file" --version v1
fi
"""

[tasks."db:init"]
description = "Create the local postgres cluster if missing"
run = """
data_dir="$PWD/.data/postgres"

if [ ! -f "$data_dir/PG_VERSION" ]; then
  mkdir -p "$data_dir"
  mise x postgres -- initdb -D "$data_dir" -U postgres \\
    --auth-host=trust --auth-local=trust --no-instructions
fi
"""

[tasks.dev]
description = "Run postgres, minio, bootstrap, and the app"
depends = ["db:init", "objects:init", "portal:key"]
shell = "bash -c"
run = """
set -euo pipefail
. scripts/local-servers.sh

# dev runs its own servers in the foreground, so it stops any that db:start or
# objects:start left running.
mise x postgres -- pg_ctl -D "$postgres_dir" stop -m fast -w 2>/dev/null || true
stop_minio

require_free_port "$PORTAL_DEV_POSTGRES_PORT" postgres
require_free_port "$PORTAL_DEV_MINIO_PORT" minio
require_free_port "$PORTAL_DEV_MINIO_CONSOLE_PORT" "minio console"
require_free_port "$PORTAL_DEV_WEB_PORT" web

# The local cluster is disposable, so use relaxed durability for faster writes.
mise x postgres -- postgres -D "$postgres_dir" -h 127.0.0.1 -p "$PORTAL_DEV_POSTGRES_PORT" \\
  -c fsync=off -c synchronous_commit=off -c full_page_writes=off &
pg_pid=$!

start_minio

trap '
  rm -f "$minio_pid_file"
  kill "$minio_pid" 2>/dev/null || true
  mise x postgres -- pg_ctl -D "$postgres_dir" stop -m fast -w 2>/dev/null || kill "$pg_pid" 2>/dev/null || true
' EXIT

until mise x postgres -- pg_isready -h 127.0.0.1 -p "$PORTAL_DEV_POSTGRES_PORT" -U postgres -q; do
  sleep 0.1
done

until minio_ready; do
  sleep 0.1
done

uv run --env-file .env portal-admin bootstrap
PORT="$PORTAL_DEV_WEB_PORT" uv run --env-file .env python -m portal.web.app
"""

[tasks.reset]
description = "Delete the local postgres cluster and minio store"
shell = "bash -c"
run = """
set -euo pipefail
. scripts/local-servers.sh

mise x postgres -- pg_ctl -D "$postgres_dir" stop -m fast -w 2>/dev/null || true
stop_minio
rm -rf "$postgres_dir" "$minio_dir"
"""

[tasks."db:start"]
description = "Start the local postgres cluster, or adopt this checkout's running one"
depends = ["db:init"]
shell = "bash -c"
run = """
set -euo pipefail
. scripts/local-servers.sh

if ! postgres_owned; then
  # This checkout's cluster running on another port is restarted on the
  # derived port.
  if postgres_running; then
    mise x postgres -- pg_ctl -D "$postgres_dir" stop -m fast -w
  fi
  require_free_port "$PORTAL_DEV_POSTGRES_PORT" postgres

  mise x postgres -- pg_ctl -D "$postgres_dir" \\
    -l "$postgres_dir/server.log" \\
    -o "-h 127.0.0.1 -p $PORTAL_DEV_POSTGRES_PORT -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \\
    -w start
fi
"""

[tasks."objects:init"]
description = "Create the local minio data dir if missing"
run = """
mkdir -p "$PWD/.data/minio"
"""

[tasks."objects:start"]
description = "Start the local minio server, or adopt this checkout's running one"
depends = ["objects:init"]
shell = "bash -c"
run = """
set -euo pipefail
. scripts/local-servers.sh

if ! minio_owned; then
  stop_minio
  require_free_port "$PORTAL_DEV_MINIO_PORT" minio
  require_free_port "$PORTAL_DEV_MINIO_CONSOLE_PORT" "minio console"

  start_minio

  for _ in $(seq 1 50); do
    if minio_ready; then
      exit 0
    fi
    sleep 0.1
  done

  echo "MinIO did not become ready" >&2
  exit 1
fi
"""

[tasks."portal:schema"]
description = "Snapshot the portal schema"
depends = ["db:start"]
run = """
uv run --env-file .env portal-admin migrate

mise x postgres -- pg_dump -h 127.0.0.1 -p "$PORTAL_DEV_POSTGRES_PORT" -U postgres -d postgres \\
  --schema-only --no-owner --no-privileges \\
  --exclude-table=portal_schema_migrations \\
  | grep -v -e '^\\\\restrict ' -e '^\\\\unrestrict ' \\
            -e '^-- Dumped from database version' \\
            -e '^-- Dumped by pg_dump version' \\
  > packages/portal/schema.sql
"""

[tasks.check]
run = [
  "uv run ops/check_docs.py",
  "uv run ruff format --check",
  "uv run ruff check",
  "uv run mypy .",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --check",
  "uv lock --check",
  "uv lock --check --project packages/cli",
  "uv lock --check --project packages/portal",
  "mise run test",
  "mise run build",
]

[tasks."infra:check"]
description = "Lint the AWS test script and validate its Terraform"
run = [
  "shellcheck scripts/e2e-aws.sh",
  "terraform -chdir=infra/aws fmt -check -recursive",
  "terraform -chdir=infra/aws init -input=false -backend=false",
  "terraform -chdir=infra/aws validate",
]

[tasks."e2e:aws"]
description = "Create core and worker on AWS, provision them, run the hook, and destroy them"
run = "scripts/e2e-aws.sh all"

[tasks."e2e:aws:up"]
description = "Create core and worker on AWS and print their public IPs"
run = "scripts/e2e-aws.sh up"

[tasks."e2e:aws:provision"]
description = "Run vps-setup on both servers, then install Docker and Dokploy"
run = "scripts/e2e-aws.sh provision"

[tasks."e2e:aws:down"]
description = "Destroy both AWS servers"
run = "scripts/e2e-aws.sh down"

[tasks."e2e:aws:sweep"]
description = "Terminate AWS test leftovers older than two hours"
run = "scripts/e2e-aws.sh sweep"

[tasks.test]
shell = "bash -c"
run = """
set -euo pipefail
if [ -z "${PORTAL_TEST_DSN:-}" ]; then
  mise run db:start
  mise run objects:start
fi
uv run pytest
"""

[tasks.build]
run = [
  "rm -rf packages/cli/dist packages/cli/build",
  "uv run pyinstaller --distpath packages/cli/dist --workpath packages/cli/build packages/cli/fetch.spec",
]
