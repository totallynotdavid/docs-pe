[tools]
uv = "0.12.6"
python = "3.14.7"
postgres = "18.6"
minio = "2025.01.20.14.49.07"
node = "26.8.1"

[tasks.install]
run = "uv sync --all-groups"

[tasks."install:core"]
run = "uv sync --all-groups --reinstall-package core"

[tasks.update]
run = [
  "uv lock -U",
  "uv lock --project packages/cli -U",
  "uv lock --project packages/portal -U",
]

[tasks.outdated]
run = "uv pip list --outdated"

[tasks.format]
run = [
  "uv run ruff format",
  "uv run ruff check --fix",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --reformat --quiet",
]

[tasks."portal:assets"]
description = "Refresh vendored browser assets"
run = ["npm ci --no-audit --no-fund", "npm run vendor"]

[tasks."portal:docker:build"]
run = "docker build --file packages/portal/Dockerfile --tag portal ."

[tasks."portal:key"]
description = "Write the local master key file if it is missing"
run = """
key_file="$PWD/.data/master.key"

if [ ! -f "$key_file" ]; then
  mkdir -p "$PWD/.data"
  uv run portal-admin key install --path "$key_file" --version v1
fi
"""

[tasks."db:init"]
description = "Create the local postgres cluster if missing"
run = """
data_dir="$PWD/.data/postgres"

if [ ! -f "$data_dir/PG_VERSION" ]; then
  mkdir -p "$data_dir"
  mise x postgres -- initdb -D "$data_dir" -U postgres \\
    --auth-host=trust --auth-local=trust --no-instructions
fi
"""

[tasks.dev]
description = "Run postgres, minio, bootstrap, and the app"
depends = ["db:init", "objects:init", "portal:key"]
run = """
data_dir="$PWD/.data/postgres"

# Development owns its postmaster. Stop a cluster left by `db:start` first.
mise x postgres -- pg_ctl -D "$data_dir" stop -m fast -w 2>/dev/null || true

# The local cluster is disposable, so use relaxed durability for faster writes.
mise x postgres -- postgres -D "$data_dir" -h 127.0.0.1 -p 5432 \\
  -c fsync=off -c synchronous_commit=off -c full_page_writes=off &
pg_pid=$!

MINIO_ROOT_USER=portal-dev MINIO_ROOT_PASSWORD=portal-dev-secret \\
  mise x minio -- minio server "$PWD/.data/minio" \\
    --address 127.0.0.1:9100 --console-address 127.0.0.1:9101 \\
    > "$PWD/.data/minio/server.log" 2>&1 &
minio_pid=$!

trap '
  mise x postgres -- pg_ctl -D "$data_dir" stop -m fast -w 2>/dev/null || kill "$pg_pid" 2>/dev/null
  kill "$minio_pid" 2>/dev/null
' EXIT

until mise x postgres -- pg_isready -h 127.0.0.1 -p 5432 -U postgres -q; do
  sleep 0.1
done

until curl -sf http://127.0.0.1:9100/minio/health/live >/dev/null 2>&1; do
  sleep 0.1
done

uv run --env-file .env portal-admin bootstrap
uv run --env-file .env python -m portal.web.app
"""

[tasks.reset]
description = "Delete the local postgres cluster and minio store"
run = """
mise x postgres -- pg_ctl -D "$PWD/.data/postgres" stop -m fast -w 2>/dev/null || true
rm -rf "$PWD/.data/postgres"
rm -rf "$PWD/.data/minio"
"""

[tasks."db:start"]
description = "Start the local postgres cluster"
depends = ["db:init"]
run = """
if ! mise x postgres -- pg_isready -h 127.0.0.1 -p 5432 -U postgres -q; then
  mise x postgres -- pg_ctl -D "$PWD/.data/postgres" \\
    -l "$PWD/.data/postgres/server.log" \\
    -o "-h 127.0.0.1 -p 5432 -c fsync=off -c synchronous_commit=off -c full_page_writes=off" \\
    -w start
fi
"""

[tasks."objects:init"]
description = "Create the local minio data dir if missing"
run = """
mkdir -p "$PWD/.data/minio"
"""

[tasks."objects:start"]
description = "Start the local minio server"
depends = ["objects:init"]
run = """
if ! curl -sf http://127.0.0.1:9100/minio/health/live >/dev/null 2>&1; then
  MINIO_ROOT_USER=portal-dev MINIO_ROOT_PASSWORD=portal-dev-secret \\
    mise x minio -- minio server "$PWD/.data/minio" \\
      --address 127.0.0.1:9100 --console-address 127.0.0.1:9101 \\
      > "$PWD/.data/minio/server.log" 2>&1 &
  disown

  for _ in $(seq 1 50); do
    curl -sf http://127.0.0.1:9100/minio/health/live >/dev/null 2>&1 && break
    sleep 0.1
  done
fi
"""

[tasks."portal:schema"]
description = "Snapshot the portal schema"
depends = ["db:start"]
run = """
uv run --env-file .env portal-admin migrate

mise x postgres -- pg_dump -h 127.0.0.1 -p 5432 -U postgres -d postgres \\
  --schema-only --no-owner --no-privileges \\
  --exclude-table=portal_schema_migrations \\
  | grep -v -e '^\\\\restrict ' -e '^\\\\unrestrict ' \\
            -e '^-- Dumped from database version' \\
            -e '^-- Dumped by pg_dump version' \\
  > packages/portal/schema.sql
"""

[tasks.check]
run = [
  "uv run ops/check_docs.py",
  "uv run mypy .",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --check",
]

[tasks.test]
depends = ["db:start", "objects:start"]
run = "uv run pytest"

[tasks.build]
run = [
  "rm -rf packages/cli/dist packages/cli/build",
  "uv run pyinstaller --distpath packages/cli/dist --workpath packages/cli/build packages/cli/fetch.spec",
]
