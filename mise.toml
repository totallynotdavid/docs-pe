[tools]
uv = "0.12.0"
python = "3.14.6"
postgres = "18.4"
node = "26.5.1"

[tasks.install]
run = "uv sync --all-packages --all-groups"

[tasks.update]
run = "uv sync -U"

[tasks.outdated]
run = "uv pip list --outdated"

[tasks.format]
run = [
  "uv run ruff format",
  "uv run ruff check --fix",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --reformat --quiet",
]

[tasks."portal:assets"]
description = "Refresh the vendored browser dependencies from the versions pinned in package.json"
run = ["npm ci --no-audit --no-fund", "npm run vendor"]

[tasks."portal:db:start"]
description = "Start the local PostgreSQL cluster used by the portal"
run = """
data_dir="$PWD/var/postgres"

if mise x postgres -- pg_isready -h 127.0.0.1 -p 5432 -U postgres -q; then
  exit 0
fi

if [ ! -f "$data_dir/PG_VERSION" ]; then
  mkdir -p "$data_dir"
  mise x postgres -- initdb -D "$data_dir" -U postgres \\
    --auth-host=trust --auth-local=trust --no-instructions
fi

mise x postgres -- pg_ctl -D "$data_dir" -l "$data_dir/server.log" \\
  -o "-h 127.0.0.1 -p 5432" start
"""

[tasks."portal:migrate"]
description = "Apply pending portal schema migrations"
depends = ["portal:db:start"]
run = "uv run --env-file .env portal-migrate"

[tasks."portal:bootstrap"]
description = "Idempotently provision the local portal administrator and first team"
depends = ["portal:migrate"]
run = "uv run --env-file .env portal-bootstrap"

[tasks."portal:dev"]
description = "Start PostgreSQL, migrate, bootstrap, then run the portal"
depends = ["portal:bootstrap"]
run = "uv run --env-file .env osiptel-portal"

[tasks.check]
run = [
  "uv run mypy .",
  "uv run djlint packages/portal/portal/web/components packages/portal/portal/web/pages --check",
]

[tasks.test]
run = "uv run pytest"

[tasks.build]
run = [
  "rm -rf packages/fetch/dist packages/fetch/build",
  "uv run pyinstaller --distpath packages/fetch/dist --workpath packages/fetch/build packages/fetch/fetch.spec",
]
