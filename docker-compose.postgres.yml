services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [dokploy-network]
    restart: unless-stopped

  # Reassert the service endpoint because it is not persistent across restarts.
  tailscale:
    image: tailscale/tailscale:latest
    network_mode: "service:postgres"
    cap_add: [net_admin, net_raw]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_DATABASE}
      TS_HOSTNAME: portal-database
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:core
    entrypoint: ["/bin/sh", "-c"]
    command:
      # $$ passes a literal $ through Compose to the shell.
      - |
        /usr/local/bin/containerboot &
        boot_pid=$!
        while kill -0 "$$boot_pid" 2>/dev/null; do
          tailscale --socket=/tmp/tailscaled.sock serve --service=svc:database --tcp=5432 tcp://localhost:5432 >/dev/null 2>&1
          sleep 10
        done
        exit 1
    volumes:
      - ts-database-state:/var/lib/tailscale
    restart: unless-stopped
    depends_on: [postgres]

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME_NAME}
  ts-database-state:

networks:
  dokploy-network:
    external: true
