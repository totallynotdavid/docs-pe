services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [dokploy-network]
    restart: unless-stopped

  # containerboot's TS_SERVE_CONFIG does not reliably apply a `services:`
  # endpoint mapping: confirmed against production that it leaves
  # `tailscale serve get-config --all` showing endpoints: null indefinitely,
  # even with TS_EXPERIMENTAL_SERVICE_AUTO_ADVERTISEMENT=true (that flag only
  # sets AdvertiseServices, not the port forward itself). The CLI command is
  # the only mechanism confirmed to work, so containerboot runs as a
  # background process and this reasserts the endpoint on top of it, every
  # 10s, so it's self-healing across containerboot's own reconnects and
  # survives this container's own restarts (the endpoint does not persist in
  # tailscaled's state across a restart, unlike the tailnet identity itself).
  # If containerboot itself dies (seen live: it gave up and exited after a
  # transient "network is down" during a container recreation), the loop
  # exits instead of retrying against a socket that will never come back, so
  # `restart: unless-stopped` gets a real dead container to restart rather
  # than a shell script silently spinning forever.
  tailscale:
    image: tailscale/tailscale:latest
    network_mode: "service:postgres"
    cap_add: [net_admin, net_raw]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY_DATABASE}
      TS_HOSTNAME: portal-database
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:core
    entrypoint: ["/bin/sh", "-c"]
    command:
      # $$boot_pid (not $boot_pid): Compose's own variable interpolation
      # matches bare $VAR too, not just ${VAR}, and silently strips it to an
      # empty string if undefined -- confirmed live by running plain
      # `docker compose up` directly against this file (Dokploy's own deploy
      # path does not hit this). $$ escapes to a literal $ for the shell.
      - |
        /usr/local/bin/containerboot &
        boot_pid=$!
        while kill -0 "$$boot_pid" 2>/dev/null; do
          tailscale --socket=/tmp/tailscaled.sock serve --service=svc:database --tcp=5432 tcp://localhost:5432 >/dev/null 2>&1
          sleep 10
        done
        exit 1
    volumes:
      - ts-database-state:/var/lib/tailscale
    restart: unless-stopped
    depends_on: [postgres]

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME_NAME}
  ts-database-state:

networks:
  dokploy-network:
    external: true
