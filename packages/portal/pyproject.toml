[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal"
version = "0.1.0"
description = "Web portal and worker for managing fetch jobs."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30.0",
  "cryptography>=44.0.0",
  "fastapi>=0.141.1",
  "fetch",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "jinjax>=0.65",
  "pwdlib[argon2]>=0.3.0",
  "pydantic>=2.13.4",
  "python-multipart>=0.0.32",
  "uvicorn>=0.41.0",
]

[project.scripts]
portal = "portal.web.app:main"
portal-bootstrap = "portal.bootstrap:main"
portal-migrate = "portal.migrate:main"
portal-provision = "portal.provision:main"
portal-worker = "portal.worker.service:main"

[tool.uv.sources]
fetch = { workspace = true }

[tool.setuptools.packages.find]
include = ["portal*"]

[tool.setuptools.package-data]
portal = [
  "migrations/*.sql",
  "web/components/*.css",
  "web/components/*.jinja",
  "web/pages/*.jinja",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/*.woff2",
]

[tool.djlint]
profile = "jinja"
indent = 2
extension = "jinja"
custom_html = "[A-Z][a-zA-Z0-9]*" # Preserve JinjaX component tags.
