[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal"
version = "0.1.0"
requires-python = ">=3.11"
description = "Team-scoped portal control plane backed only by PostgreSQL."
dependencies = [
  "asyncpg>=0.30.0",
  "cryptography>=44.0.0",
  "fastapi>=0.135.0",
  "fetch",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "jinjax>=0.65",
  "pwdlib[argon2]>=0.3.0",
  "python-multipart>=0.0.20",
  "uvicorn>=0.41.0",
]

[project.scripts]
portal = "portal.web.app:main"
portal-worker = "portal.worker.service:main"
portal-bootstrap = "portal.bootstrap:main"
portal-migrate = "portal.migrate:main"
portal-provision = "portal.provision:main"

[tool.uv.sources]
fetch = { workspace = true }

[tool.setuptools.packages.find]
include = ["portal*"]

[tool.setuptools.package-data]
portal = [
  "migrations/*.sql",
  "web/components/*.css",
  "web/components/*.jinja",
  "web/pages/*.jinja",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/*.woff2",
]

# djLint resolves its configuration from the nearest pyproject.toml above the
# templates it is given, which is this one rather than the workspace root.
# `custom_html` is what teaches it that a capitalised tag is an element: without
# it djLint flattens every JinjaX component tree it is asked to hold.
[tool.djlint]
profile = "jinja"
indent = 2
extension = "jinja"
custom_html = "[A-Z][a-zA-Z0-9]*"
