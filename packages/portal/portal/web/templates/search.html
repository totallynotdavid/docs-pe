{% extends "base.html" %}
{% block title %}Buscar · {{ team.name }} · Worker{% endblock %}
{% block titlebar %}Buscar documentos{% endblock %}
{% block content %}
<h1 class="solo-lector">Buscar documentos en {{ team.name }}</h1>
<section class="panel"><div class="panel-cuerpo"><form method="get" action="/equipos/{{ team.id }}/buscar" class="busqueda" hx-get="/equipos/{{ team.id }}/buscar/fragmento" hx-target="#resultados-busqueda" hx-push-url="true"><label for="consulta">Número de documento</label><input id="consulta" name="q" value="{{ query }}" autocomplete="off" placeholder="Ej. 10412345678"><button type="submit">Buscar</button></form></div><div id="resultados-busqueda">{% include "fragments/search_results.html" %}</div></section>
{% endblock %}
