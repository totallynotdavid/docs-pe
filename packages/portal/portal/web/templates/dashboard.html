{% extends "base.html" %}
{% block title %}Equipos · Worker{% endblock %}
{% block content %}
<section class="panel" aria-labelledby="titulo-equipos">
  <p class="ceja">{{ user.email }}</p>
  <h1 id="titulo-equipos">Equipos</h1>
  {% if teams %}
  <ul class="lista-enlaces">
    {% for team in teams %}
    <li><a href="/equipos/{{ team.id }}">{{ team.name }}</a><span>{{ team.role|rol }}</span></li>
    {% endfor %}
  </ul>
  {% else %}<p class="estado-vacio">Aún no perteneces a un equipo.</p>{% endif %}
</section>
{% endblock %}
