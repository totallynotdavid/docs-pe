{% extends "base.html" %}
{% block title %}Crear equipo · Worker{% endblock %}
{% block content %}
<header class="encabezado-pagina"><div><p class="ceja">Primer paso</p><h1>Crea tu primer equipo</h1><p class="subtitulo">Los equipos mantienen separadas las consultas, las conexiones y las personas que colaboran.</p></div></header>
<section class="panel"><div class="panel-cuerpo">{% if error %}<p class="mensaje mensaje--error" role="alert">{{ error }}</p>{% endif %}<form action="/inicio" method="post" class="formulario"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nombre del equipo<input name="name" maxlength="120" required autofocus placeholder="Ej. Equipo Lima"></label><label>Dirección del equipo<input name="slug" pattern="[a-z0-9][a-z0-9-]{1,62}" required placeholder="equipo-lima"><span class="ayuda">Se usa para identificar el equipo en su enlace. Solo minúsculas, números y guiones.</span></label><button type="submit">Crear equipo</button></form></div></section>
{% endblock %}
