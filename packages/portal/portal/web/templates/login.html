{% extends "base.html" %}
{% block title %}Ingresar · Portal OSIPTEL{% endblock %}
{% block content %}
<section class="panel panel--estrecho" aria-labelledby="titulo-ingreso">
  <p class="ceja">Acceso autorizado</p>
  <h1 id="titulo-ingreso">Ingresar al portal</h1>
  <p>Use las credenciales entregadas por la administración. No hay registro público.</p>
  {% if error %}<p class="mensaje mensaje--error" role="alert">No se pudo iniciar sesión.</p>{% endif %}
  <form method="post" action="/login" class="formulario">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Correo electrónico <input type="email" name="email" autocomplete="email" required></label>
    <label>Contraseña <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
