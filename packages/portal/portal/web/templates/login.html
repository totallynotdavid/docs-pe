{% extends "base.html" %}
{% block title %}Ingresar · Worker{% endblock %}
{% block content %}
  <section class="panel panel--estrecho" aria-labelledby="titulo-ingreso">
    <div class="marca-auth" aria-hidden="true">W</div>
    <h1 id="titulo-ingreso">Iniciar sesión</h1>
    <p class="descripcion-auth">Accede al portal de Worker.</p>
    {% if error %}
      <p class="mensaje mensaje--error" role="alert">No se pudo iniciar sesión.</p>
    {% endif %}
    <form method="post" action="/login" class="formulario">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>
        Correo electrónico
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>
        Contraseña
        <input type="password"
               name="password"
               autocomplete="current-password"
               required>
      </label>
      <button type="submit">Ingresar</button>
    </form>
  </section>
{% endblock %}
