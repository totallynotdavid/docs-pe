[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osiptel-jobs"
version = "0.1.0"
requires-python = ">=3.11"
description = "Authenticated OSIPTEL batch jobs control plane and outbound worker."
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.135.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
    "fetch",
]

[tool.uv.sources]
fetch = { workspace = true }

[project.scripts]
osiptel-jobs = "jobs.web:main"
osiptel-jobs-worker = "jobs.worker:main"

[tool.setuptools.packages.find]
include = ["jobs*"]
