[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capture"
version = "0.1.0"
requires-python = ">=3.11"
description = "Human-in-the-loop discovery and collection: intercept a site's own calls from a reputable Chrome to learn and run its recipe. Standard library only."
dependencies = []

[project.scripts]
capture = "capture.cli:main"

[tool.setuptools.packages.find]
include = ["capture*"]

[tool.setuptools.package-data]
capture = ["*.js", "sites/entel/*.js"]
