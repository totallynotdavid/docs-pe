version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: aiobotocore
      - dependency-name: behave
      - dependency-name: boto3
      - dependency-name: botocore
      - dependency-name: htmx.org
      - dependency-name: multidict
      - dependency-name: pytest-html
      - dependency-name: s3transfer
      - dependency-name: wrapt

  - package-ecosystem: uv
    directories:
      - /
      - /packages/cli
      - /packages/portal
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: aiobotocore
      - dependency-name: behave
      - dependency-name: boto3
      - dependency-name: botocore
      - dependency-name: htmx.org
      - dependency-name: multidict
      - dependency-name: pytest-html
      - dependency-name: s3transfer
      - dependency-name: wrapt

  - package-ecosystem: docker
    directories:
      - /packages/portal
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: aiobotocore
      - dependency-name: behave
      - dependency-name: boto3
      - dependency-name: botocore
      - dependency-name: htmx.org
      - dependency-name: multidict
      - dependency-name: pytest-html
      - dependency-name: s3transfer
      - dependency-name: wrapt

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        update-types:
          - major
          - minor
          - patch
    ignore:
      - dependency-name: aiobotocore
      - dependency-name: behave
      - dependency-name: boto3
      - dependency-name: botocore
      - dependency-name: htmx.org
      - dependency-name: multidict
      - dependency-name: pytest-html
      - dependency-name: s3transfer
      - dependency-name: wrapt
