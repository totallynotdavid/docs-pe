version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/packages/cli"
      - "/packages/portal"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
