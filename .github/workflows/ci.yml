name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.1"
          cache: npm

      - name: Install pinned browser dependencies
        run: npm ci --no-audit --no-fund

      - name: Check vendored assets
        run: |
          npm run vendor
          git diff --exit-code -- packages/portal/portal/web/static

  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.14.6

      - run: uv sync --locked --all-packages --all-groups

      - run: uv run ruff format --check

      - run: uv run ruff check

      - run: >
          uv run djlint packages/portal/portal/web/components
          packages/portal/portal/web/pages --check

      - run: uv run mypy .

      - name: Test
        run: uv run pytest
