name: ci

on:
  push:
    branches: [master, scale]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - name: Install browser dependencies and refresh vendored assets
        run: mise run portal:assets

      - name: Check vendored assets
        run: git diff --exit-code -- packages/portal/portal/web/static

  validate:
    runs-on: ubuntu-latest
    env:
      MISE_DISABLE_TOOLS: postgres
      PORTAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          minimum_release_age: 0s
          persist_github_token: true

      - run: mise run install

      - name: Start MinIO
        run: mise run --skip-tools objects:start

      # The database is disposable, and service containers cannot receive
      # these PostgreSQL server flags directly.
      - name: Disable PostgreSQL durability
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = 'off'" \
            -c "ALTER SYSTEM SET synchronous_commit = 'off'" \
            -c "ALTER SYSTEM SET full_page_writes = 'off'" \
            -c "SELECT pg_reload_conf()"

      - run: mise run check

      - name: Check the AWS test infrastructure
        run: mise run infra:check

  # Deployments pull ghcr.io/<owner>/<repository>/portal:<commit SHA>.
  image:
    if: github.event_name == 'push'
    needs: [assets, validate]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GHCR accepts only lowercase repository names.
      - name: Name the image
        run: echo "PORTAL_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/portal:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: packages/portal/Dockerfile
          push: true
          tags: ${{ env.PORTAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
