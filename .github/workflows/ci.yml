name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned browser dependencies
        run: npm ci --no-audit --no-fund

      - name: Vendored assets match the pinned versions
        run: |
          npm run vendor
          git diff --exit-code -- packages/portal/portal/web/static

  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Format check
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Template format check
        run: uv run djlint packages/portal/portal/web/templates --check

      - name: Type check
        run: uv run mypy .

      - name: Test
        env:
          PORTAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest
