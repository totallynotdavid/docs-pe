name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.1"
          cache: npm

      - name: Install pinned browser dependencies
        run: npm ci --no-audit --no-fund

      - name: Check vendored assets
        run: |
          npm run vendor
          git diff --exit-code -- packages/portal/portal/web/static

  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            packages/cli/uv.lock
            packages/portal/uv.lock

      - run: uv python install 3.14.6

      - run: |
          uv lock --check
          uv lock --check --project packages/cli
          uv lock --check --project packages/portal

      - run: uv sync --locked --all-groups

      - run: uv run ruff format --check

      - run: uv run ruff check

      - run: >
          uv run djlint packages/portal/portal/web/components
          packages/portal/portal/web/pages --check

      - run: uv run mypy .

      # The database is disposable, and service containers cannot receive
      # these PostgreSQL server flags directly.
      - name: Disable PostgreSQL durability
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -c "ALTER SYSTEM SET fsync = 'off'" \
            -c "ALTER SYSTEM SET synchronous_commit = 'off'" \
            -c "ALTER SYSTEM SET full_page_writes = 'off'" \
            -c "SELECT pg_reload_conf()"

      - name: Test
        env:
          PORTAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: uv run pytest
