[project]
name = "osiptel-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "browser",
  "capture",
  "cli",
  "core",
  "portal",
]

[tool.uv]
package = false

[tool.uv.sources]
browser = { path = "packages/browser", editable = true }
capture = { path = "packages/capture", editable = true }
cli = { path = "packages/cli", editable = true }
core = { path = "packages/core" }
portal = { path = "packages/portal", editable = true }

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
preview = true
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "I",
  "UP",
  "SIM",
  "RUF",
]

ignore = ["missing-trailing-comma", "try-consider-else", "missing-copyright-notice"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
lines-between-types = 1
lines-after-imports = 2
order-by-type = true
relative-imports-order = "closest-to-furthest"
extra-standard-library = ["typing"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"packages/portal/**/*.py" = [
  "function-call-in-default-argument",
  "complex-structure",
  "raw-string-in-exception",
  "f-string-in-exception",
  "error-suffix-on-exception-name",
  "unused-async",
  "typing-only-first-party-import",
  "typing-only-third-party-import",
  "typing-only-standard-library-import",
  "raise-vanilla-args",
  # Route handlers are always called by Litestar's dependency injection, by
  # keyword, never positionally, so a bool query param with a default isn't
  # the ambiguous call site this rule is meant to catch.
  "boolean-default-value-positional-argument",
]

[tool.mypy]
exclude_gitignore = true
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "core.*", "psutil", "aioboto3", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ops.*", "portal.*", "tests.*"]
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
# Apply asyncio support to every async test.
asyncio_mode = "auto"
addopts = ["--strict-markers"]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "djlint==1.47.0",
  "httpx2>=2.16.0",
  "mypy>=2.4.0",
  "pyinstaller>=6.22.3",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff==0.17.2",
]
